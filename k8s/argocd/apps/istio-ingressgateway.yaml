apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingressgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.23.2
    helm:
      values: |
        service:
          type: LoadBalancer
          # Change to NodePort or ClusterIP + an external LB/Ingress
          # controller depending on where this cluster actually runs
          # (cloud LB here assumes EKS/GKE/AKS or a bare-metal LB like
          # MetalLB already provisioned).
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
