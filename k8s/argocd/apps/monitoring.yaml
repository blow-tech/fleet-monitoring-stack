apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-monitoring
  namespace: argocd
  annotations:
    # Waits for the mesh to be up (wave 2) before deploying workloads that
    # rely on sidecar injection for mTLS.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    # Upstream community chart — this is the same battle-tested stack most
    # production clusters run (Prometheus Operator, Alertmanager, Grafana,
    # node-exporter DaemonSet, kube-state-metrics), rather than hand-rolled
    # manifests.
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "65.5.1"
      helm:
        valueFiles:
          - $values/k8s/helm-values/kube-prometheus-stack-values.yaml
    # Second source: this repo, purely so the Helm invocation above can
    # reference the values file living in helm-values/ by path.
    - repoURL: https://github.com/blow-tech/fleet-monitoring-stack.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
