apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: fleet-monitoring-gateway
  namespace: monitoring
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        # Create this secret in istio-system before syncing, e.g. via
        # cert-manager or:
        #   kubectl create secret tls fleet-monitoring-tls \
        #     --namespace istio-system \
        #     --cert=grafana.example.com.crt --key=grafana.example.com.key
        credentialName: fleet-monitoring-tls
      hosts:
        - "grafana.example.com"
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "grafana.example.com"
      # Redirect plain HTTP straight to HTTPS rather than serving over it.
      tls:
        httpsRedirect: true
