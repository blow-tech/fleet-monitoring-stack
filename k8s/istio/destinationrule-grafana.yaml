apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: grafana
  namespace: monitoring
spec:
  host: fleet-monitoring-grafana.monitoring.svc.cluster.local
  trafficPolicy:
    tls:
      # Pairs with PeerAuthentication STRICT — tells client sidecars to
      # actually use the mesh's mTLS certs when calling Grafana, rather
      # than relying on mode alone.
      mode: ISTIO_MUTUAL
