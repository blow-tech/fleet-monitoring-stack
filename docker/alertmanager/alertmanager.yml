# Base Alertmanager config. Ships with a "null" receiver (drops alerts) so
# the stack runs cleanly out of the box. Uncomment and fill in the Slack (or
# other) receiver to actually route notifications before relying on this in
# production.

global:
  resolve_timeout: 5m

route:
  receiver: "null"
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes: []
  # Example: route disk/CPU criticals to Slack instead of the null receiver
  # routes:
  #   - matchers:
  #       - severity="critical"
  #     receiver: "slack-critical"

receivers:
  - name: "null"

  # - name: "slack-critical"
  #   slack_configs:
  #     - api_url: "https://hooks.slack.com/services/REPLACE/ME/WEBHOOK"
  #       channel: "#infra-alerts"
  #       send_resolved: true
  #       title: '{{ .CommonAnnotations.summary }}'
  #       text: '{{ .CommonAnnotations.description }}'

inhibit_rules:
  - source_matchers: ["severity=critical"]
    target_matchers: ["severity=warning"]
    equal: ["alertname", "instance"]
