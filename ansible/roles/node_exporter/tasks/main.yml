---
# tasks/main.yml — role: node_exporter
# Installs node_exporter as a systemd service, restricted to accept scrapes
# only from the monitoring host (via firewalld rich rule), not the whole
# subnet. Applied to the [fleet] group — the monitoring host gets its own
# node-exporter via the Docker Compose stack instead (see monitoring_server
# role), so this role is NOT applied to the [monitoring] group.

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Check if node_exporter binary is already at the target version
  ansible.builtin.command: "{{ node_exporter_install_dir }}/node_exporter --version"
  register: node_exporter_current
  changed_when: false
  failed_when: false

- name: Validate supported platform before downloading
  ansible.builtin.assert:
    that:
      - ansible_architecture == 'x86_64'
      - node_exporter_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: "This role supports the reviewed linux-amd64 archive only."

- name: Install the desired version with retryable private staging
  when: >-
    node_exporter_current.rc != 0 or ('version ' ~ node_exporter_version ~ ' ') not in
    ((node_exporter_current.stdout | default('')) ~ ' ' ~ (node_exporter_current.stderr | default('')))
  block:
    - name: Allocate private staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: node-exporter-
      register: node_exporter_stage

    - name: Download and verify archive before extraction
      ansible.builtin.get_url:
        url: >-
          https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
        dest: "{{ node_exporter_stage.path }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        checksum: "sha256:https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/sha256sums.txt"
        mode: "0600"

    - name: Extract verified local archive
      ansible.builtin.unarchive:
        src: "{{ node_exporter_stage.path }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "{{ node_exporter_stage.path }}"
        remote_src: true

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "{{ node_exporter_stage.path }}/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "{{ node_exporter_install_dir }}/node_exporter"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart node_exporter
  always:
    - name: Remove only this run's private staging directory
      ansible.builtin.file:
        path: "{{ node_exporter_stage.path }}"
        state: absent
      when: node_exporter_stage.path is defined

- name: Deploy node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Allow node_exporter port only from the monitoring host
  # firewalld needs a real IP, not a hostname — uses the monitoring host's
  # gathered fact (requires gather_facts: true in the play, and the
  # monitoring host to have already been reached at least once so facts
  # exist in hostvars; run the playbook against [monitoring] first if this
  # errors on a completely fresh inventory).
  ansible.posix.firewalld:
    rich_rule: >-
      rule family="ipv4"
      source address="{{ hostvars[groups['monitoring'][0]]['ansible_default_ipv4']['address'] }}/32"
      port protocol="tcp" port="{{ node_exporter_port }}" accept
    permanent: true
    state: enabled
    immediate: true
  notify: Reload firewalld
