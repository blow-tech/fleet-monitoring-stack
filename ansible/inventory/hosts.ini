[monitoring]
mon01.example.local

# Ansible's [start:end] range syntax generates 20 hosts from one line —
# scaling to 50 or 200 VMs is a one-character edit here, not manual entry.
# Mix in real one-off hostnames alongside the range as needed.
[fleet]
vm-prod-[01:20].example.local

[linux_fleet:children]
monitoring
fleet

[linux_fleet:vars]
ansible_python_interpreter=/usr/bin/python3
