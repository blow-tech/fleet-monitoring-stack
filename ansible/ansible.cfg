[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
retry_files_enabled = False
# yaml-formatted stdout via ansible-core's own default callback (the old
# community.general.yaml callback plugin was removed in newer collection
# versions, so this is set via result_format instead of stdout_callback=yaml).
stdout_callback = default
result_format = yaml
roles_path = roles

[privilege_escalation]
become = True
become_method = sudo
